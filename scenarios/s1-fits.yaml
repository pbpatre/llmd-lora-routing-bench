name: s1-fits
description: Partition exists. Two hot adapters and four cold ones fit in 8 slots.
reference: llm-d-router#3392 starvation study, comment 6182873062
pods: 4
engine: {max_loras: 2, max_cpu_loras: 16, max_lora_rank: 16, max_num_seqs: 256}
adapters:
  - {prefix: hot, count: 2, rank: 16}
  - {prefix: cold, count: 4, rank: 16}
traffic:
  rate: 12
  duration_s: 180
  base_share: 0.2
  output_tokens: 256
  prompt_tokens: 64
  timeout_s: 120
  steady_after_s: 60
  classes:
    - {name: hot, group: hot, share: 0.9}
    - {name: cold, group: cold, share: 0.1}
assumed: [adapter rank 16, max_lora_rank 16, prompt length 64 words]
oracle:
  hot-0: [pod-0]
  hot-1: [pod-1]
  cold-0: [pod-2]
  cold-1: [pod-2]
  cold-2: [pod-3]
  cold-3: [pod-3]
sim: {capacity_rps: 8.0}
